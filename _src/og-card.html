<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Hanken+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#f6f2ea;font-family:"Hanken Grotesk",sans-serif;color:#123b33;position:relative}
.blob{position:absolute;right:-180px;top:-220px;width:760px;height:760px;border-radius:50%;background:radial-gradient(closest-side,#dbe9e0,transparent 72%)}
.left{position:absolute;left:72px;top:64px;width:560px}
.brand{display:flex;align-items:center;gap:16px}
.brand svg{width:64px;height:64px}
.brand b{font:400 38px/1 "DM Serif Display",serif;display:block}
.brand small{font:700 13px/1 "Hanken Grotesk";letter-spacing:.3em;text-transform:uppercase;color:#56655f}
h1{font:400 62px/1.02 "DM Serif Display",serif;margin:56px 0 22px;letter-spacing:-.01em}
h1 em{color:#b4572c}
p{font-size:22px;line-height:1.4;color:#56655f;margin:0}
.tag{position:absolute;left:72px;bottom:56px;display:flex;gap:12px}
.tag span{background:#123b33;color:#fff;border-radius:999px;padding:12px 20px;font-weight:600;font-size:19px}
.tag span.c{background:#b4572c}
.people{position:absolute;right:48px;bottom:0;display:flex;align-items:flex-end}
.people figure{margin:0;width:230px;height:230px;border-radius:28px;overflow:hidden;border:6px solid #fff;box-shadow:0 20px 40px -18px rgba(18,59,51,.45);background:#fff}
.people figure+figure{margin-left:-30px;margin-bottom:70px}
.people img{width:100%;height:100%;object-fit:cover}
.people figure:first-child{margin-bottom:150px;transform:rotate(-3deg)}
.people figure:last-child{transform:rotate(3deg)}
.names{position:absolute;right:76px;bottom:28px;font:600 20px "Hanken Grotesk";color:#123b33}
</style></head><body>
<div class="blob"></div>
<div class="left">
  <div class="brand"><svg viewBox="0 0 48 48"><rect width="48" height="48" rx="13" fill="#123b33"/><path d="M10 22 24 11l14 11" fill="none" stroke="#e9a57f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M31.5 27.5h-6.5M31.5 27.5v2.6a7.6 7.6 0 1 1-2.3-8.6" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg><div><b>Greller</b><small>Mortgage Group</small></div></div>
  <h1>Helping you build wealth through <em>real estate.</em></h1>
  <p>Buy, refinance or renew with Ontario mortgage agents Emilie Greller and Aaron Klimitz.</p>
</div>
<div class="tag"><span class="c">Purchase</span><span>Refinance</span><span>Renewal</span></div>
<div class="people">
  <figure><img src="../assets/img/emilie-greller-mortgage-agent.webp"></figure>
  <figure><img src="../assets/img/aaron-klimitz-mortgage-agent.webp"></figure>
</div>
</body></html>
